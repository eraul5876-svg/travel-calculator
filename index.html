<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Calculator v2.5.2</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{margin:0;background:#121212;color:white;font-family:Arial;padding:10px;}
.header{border:2px dashed #00ff66;border-radius:15px;padding:10px;text-align:center;margin-bottom:10px;background:#1a2a1a;}
.header h1{margin:0;font-size:18px;}
.header p{margin:5px 0 0 0;color:#00ff66;font-size:12px;font-weight:bold;}
.input-group{margin-bottom:10px;}
.input-group label{color:#00ff66;font-weight:bold;font-size:14px;display:block;margin-bottom:4px;}
.input-row{display:flex;background:#1e1e1e;border:1px solid #00ff66;border-radius:10px;overflow:hidden;}
.input-row input{flex:1;background:transparent;border:none;color:white;padding:12px;font-size:14px;outline:none;}
.input-row button{border:none;width:50px;font-size:20px;cursor:pointer;background:#00ff66;}
#map{height:320px;width:100%;border:2px solid #00ff66;border-radius:15px;margin:10px 0;}
.stats{display:flex;gap:10px;margin-bottom:10px;}
.stat{flex:1;text-align:center;}
.stat label{color:#00ff66;font-weight:bold;font-size:14px;}
.stat input{background:#1e1e1e;border:1px solid #333;color:#00ff66;border-radius:8px;padding:10px;width:100%;text-align:center;font-weight:bold;font-size:16px;box-sizing:border-box;}
.btn-calcular{width:100%;background:#00ff66;border:none;padding:15px;border-radius:10px;font-weight:bold;font-size:18px;cursor:pointer;margin-bottom:10px;}
.precio-box{background:#1e1e1e;border-radius:15px;padding:15px;text-align:center;}
.precio{color:#00ff66;font-size:40px;font-weight:bold;margin:0;}
</style>
</head>
<body>
<div class="header">
<h1>TRAVEL v2.5.2 - TODO SV SIN API KEY</h1>
<p>● GPS + INTERNET - 150 LUGARES + BUSCADOR REAL</p>
</div>
<div class="input-group">
<label>📍 ORIGEN - GPS automático 📍</label>
<div class="input-row">
<input id="origen" type="text" placeholder="Detectando tu ubicación...">
<button onclick="usarMiUbicacion()">📍</button>
</div>
</div>
<div class="input-group">
<label>🏁 DESTINO - Escribe y toca 🔍</label>
<div class="input-row">
<input id="destino" type="text" placeholder="Metrocentro Soyapango, Lourdes, etc">
<button onclick="buscarDestino()">🔍</button>
</div>
</div>
<div id="map"></div>
<div class="stats">
<div class="stat"><label>KM</label><input id="km" type="text" readonly></div>
<div class="stat"><label>MIN</label><input id="min" type="text" readonly></div>
<div class="stat"><label>$/KM</label><input id="precioKm" type="number" value="0.50"></div>
</div>
<button class="btn-calcular" onclick="calcularPrecio()">CALCULAR PRECIO</button>
<div class="precio-box">
<p class="precio" id="total">$0.00</p>
<span style="color:#00ff66">✅ GPS OK</span>
</div>
<script>
let map = L.map('map').setView([13.6929, -89.2182], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let origenCoords = null;
let destinoCoords = null;
let marcadorOrigen = null;
let marcadorDestino = null;
let linea = null;
function usarMiUbicacion(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      origenCoords = [pos.coords.latitude, pos.coords.longitude];
      if(marcadorOrigen) map.removeLayer(marcadorOrigen);
      marcadorOrigen = L.marker(origenCoords).addTo(map).bindPopup("<b>📍 ORIGEN</b><br>Tu estás aquí").openPopup();
      map.setView(origenCoords, 15);
      document.getElementById('origen').value = "Mi ubicación GPS";
    });
  }
}
usarMiUbicacion();
function buscarDestino(){
  let q = document.getElementById('destino').value;
  if(!q) return alert("Escribe a donde vas");
  fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}, El Salvador&limit=1`)
  .then(r=>r.json()).then(data=>{
    if(data.length==0) return alert("No se encontró, toca el mapa");
    let lat = parseFloat(data[0].lat); let lon = parseFloat(data[0].lon);
    destinoCoords = [lat, lon];
    if(marcadorDestino) map.removeLayer(marcadorDestino);
    marcadorDestino = L.marker(destinoCoords).addTo(map).bindPopup("<b>🏁 DESTINO</b><br>"+data[0].display_name).openPopup();
    map.setView(destinoCoords, 14);
    actualizarRuta();
  });
}
// ESTA ES LA BURBUJA QUE PEDISTE - DEJAMOS TODO IGUAL
map.on('click', function(e){
  destinoCoords = [e.latlng.lat, e.latlng.lng];
  if(marcadorDestino) map.removeLayer(marcadorDestino);
  marcadorDestino = L.marker(e.latlng).addTo(map)
    .bindPopup("<b>🏁 DESTINO</b><br>Marcado tocando el mapa<br>"+e.latlng.lat.toFixed(5)+", "+e.latlng.lng.toFixed(5))
    .openPopup();
  actualizarRuta();
});
function actualizarRuta(){
  if(!origenCoords || !destinoCoords) return;
  let dist = map.distance(origenCoords, destinoCoords)/1000;
  document.getElementById('km').value = dist.toFixed(2);
  document.getElementById('min').value = Math.round(dist/0.6);
  if(linea) map.removeLayer(linea);
  linea = L.polyline([origenCoords, destinoCoords], {color:'#00ff66', weight:4}).addTo(map);
  map.fitBounds([origenCoords, destinoCoords], {padding:[30,30]});
}
function calcularPrecio(){
  let km = parseFloat(document.getElementById('km').value);
  let precio = parseFloat(document.getElementById('precioKm').value);
  if(!km) return alert("Primero marca el destino tocando el mapa");
  let total = km * precio;
  document.getElementById('total').innerText = "$" + total.toFixed(2);
}
</script>
</body>
</html>
