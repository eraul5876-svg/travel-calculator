<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Calculator SV v2.6 - Burbuja</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{margin:0;font-family:Arial;background:#f5f5f5}
.header{background:#00C851;color:white;padding:12px;text-align:center;font-weight:bold;font-size:18px}
#map{height:42vh;width:100%}
.box{padding:12px;background:white;margin:8px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
input{width:100%;padding:11px;margin:5px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}
.btnMain{width:100%;padding:13px;background:#00C851;color:white;border:none;border-radius:10px;font-weight:bold;margin-top:6px;font-size:17px}
#precio{font-size:34px;text-align:center;color:#00C851;font-weight:bold;margin:8px 0}
#switchBurbuja{position:fixed;top:10px;right:10px;z-index:99999;background:white;padding:6px 12px;border-radius:20px;box-shadow:0 2px 10px rgba(0,0,0,.3);display:flex;align-items:center;gap:8px;font-size:12px;font-weight:bold}
#btnOnOff{width:48px;height:26px;background:#ccc;border-radius:13px;border:none;position:relative;transition:.3s}
#bolita{width:20px;height:20px;background:white;border-radius:50%;position:absolute;top:3px;left:3px;transition:.3s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
/* BURBUJA FLOTANTE */
#miniBurbuja{display:none;position:fixed;bottom:20px;right:15px;left:15px;background:white;border-radius:16px;box-shadow:0 6px 25px rgba(0,0,0,.35);z-index:99998;padding:14px;border:2px solid #00C851;touch-action:none}
</style>
</head>
<body>

<!-- SWITCH ENCENDIDO/APAGADO -->
<div id="switchBurbuja">
<span id="txtSwitch">Burbuja OFF</span>
<button id="btnOnOff" onclick="toggleBurbuja()"><div id="bolita"></div></button>
</div>

<div class="header">🚗 Travel Calculator SV</div>
<div id="map"></div>

<div class="box">
<input id="origen" placeholder="Origen: Mi ubicación GPS">
<input id="destino" placeholder="Destino: Ej. Plaza Mundo">
<button class="btnMain" onclick="buscarYCalcular()">CALCULAR VIAJE</button>
<div id="precio">$ --</div>
<div id="detalle" style="text-align:center;font-size:13px;color:#555"></div>
</div>

<!-- BURBUJA QUE SALE -->
<div id="miniBurbuja">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
<b style="color:#00C851">💰 Precio Rápido</b>
<span onclick="toggleBurbuja()" style="font-size:18px;cursor:pointer">❌</span>
</div>
<input id="bDestino" placeholder="Destino rápido">
<button class="btnMain" style="padding:10px;font-size:14px" onclick="calcBurbuja()">CALCULAR AQUÍ</button>
<div id="bPrecio" style="text-align:center;font-size:26px;font-weight:bold;color:#00C851;margin-top:8px">$ --</div>
</div>

<script>
let map = L.map('map').setView([13.6929,-89.2182],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let markerO, markerD, ruta, miPos=null;
navigator.geolocation.getCurrentPosition(p=>{
 miPos=[p.coords.latitude,p.coords.longitude];
 map.setView(miPos,15);
 markerO=L.marker(miPos).addTo(map).bindPopup('📍 Tú').openPopup();
 document.getElementById('origen').value='Mi ubicación';
});

// --- LOGICA BURBUJA ENCENDIDO APAGADO ---
let burbujaOn=false;
function toggleBurbuja(){
 burbujaOn=!burbujaOn;
 document.getElementById('miniBurbuja').style.display=burbujaOn?'block':'none';
 let btn=document.getElementById('btnOnOff'), bola=document.getElementById('bolita'), txt=document.getElementById('txtSwitch');
 if(burbujaOn){btn.style.background='#00C851';bola.style.left='25px';txt.innerText='Burbuja ON';txt.style.color='#00C851';}
 else{btn.style.background='#ccc';bola.style.left='3px';txt.innerText='Burbuja OFF';txt.style.color='#000';}
}
function calcBurbuja(){
 let d=document.getElementById('bDestino').value;
 document.getElementById('destino').value=d;
 buscarYCalcular();
}

async function buscarYCalcular(){
 let dest=document.getElementById('destino').value || document.getElementById('bDestino').value;
 if(!dest){alert('Escribe destino');return}
 let q= dest.toLowerCase().includes('mundo')? 'Plaza Mundo Soyapango' : dest + ' El Salvador';
 let res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&countrycodes=sv&limit=1`);
 let data=await res.json();
 if(!data[0]){alert('No lo encontré');return}
 let lat2=data[0].lat, lon2=data[0].lon;
 if(markerD) map.removeLayer(markerD);
 markerD=L.marker([lat2,lon2]).addTo(map).bindPopup('📍 '+data[0].display_name).openPopup();
 let origen= miPos? `${miPos[1]},${miPos[0]}` : '-89.2182,13.6929';
 let route=await fetch(`https://router.project-osrm.org/route/v1/driving/${origen};${lon2},${lat2}?overview=full&geometries=geojson`);
 let rdata=await route.json();
 if(rdata.routes && rdata.routes[0]){
  let km=rdata.routes[0].distance/1000;
  let precio=(km*0.35+1).toFixed(2);
  document.getElementById('precio').innerText='$'+precio;
  document.getElementById('bPrecio').innerText='$'+precio;
  document.getElementById('detalle').innerText=km.toFixed(1)+' km - Ruta real';
  if(ruta) map.removeLayer(ruta);
  ruta=L.geoJSON(rdata.routes[0].geometry,{style:{color:'#00C851',weight:5}}).addTo(map);
  map.fitBounds(ruta.getBounds(),{padding:[30,30]});
 }
}
</script>
</body>
</html>
